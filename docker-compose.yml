# Local development services only. Production uses Supabase (Postgres, Auth, Storage) or any S3-compatible store.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fp
      POSTGRES_PASSWORD: fp
      POSTGRES_DB: fp_dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fpdev
      MINIO_ROOT_PASSWORD: fpdevpassword
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  miniodata:
